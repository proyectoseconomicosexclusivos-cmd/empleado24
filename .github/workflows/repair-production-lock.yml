name: Repair production dependency lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-production-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Update only audited production dependencies
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.pnpm = pkg.pnpm || {};
          pkg.pnpm.overrides = {
            ...(pkg.pnpm.overrides || {}),
            next: '15.5.21',
            sharp: '0.35.0',
            postcss: '8.5.18',
            'brace-expansion': '1.1.18',
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm --filter @empleado24/web update next@15.5.21
          pnpm install --no-frozen-lockfile
      - name: Commit resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "chore(security): resolve production dependency advisories"
          git push origin HEAD:main
