name: Recover Hetzner deploy access

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empleado24-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authorize existing deployment key in installed system
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.28.17.124
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eux
            mkdir -p /mnt/host
            root_device="$(blkid -L cloudimg-rootfs || true)"
            if [ -z "$root_device" ]; then
              root_device="$(lsblk -b -rpno NAME,FSTYPE,SIZE,MOUNTPOINT | awk '$2 == "ext4" && $4 == "" { print $3 " " $1 }' | sort -nr | head -1 | cut -d' ' -f2-)"
            fi
            test -n "$root_device"
            mount "$root_device" /mnt/host
            test -f /mnt/host/etc/os-release
            if ! grep -q '^deploy:' /mnt/host/etc/passwd; then
              chroot /mnt/host useradd -m -s /bin/bash deploy
            fi
            deploy_uid="$(awk -F: '$1 == "deploy" { print $3 }' /mnt/host/etc/passwd)"
            deploy_gid="$(awk -F: '$1 == "deploy" { print $4 }' /mnt/host/etc/passwd)"
            install -d -m 700 /mnt/host/home/deploy/.ssh
            touch /mnt/host/home/deploy/.ssh/authorized_keys
            public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICChERDAMmWaDn9o032aiNwDoTrW/ZqJP2Ckvwvsl5yn github-actions-empleado24'
            grep -qxF "$public_key" /mnt/host/home/deploy/.ssh/authorized_keys || echo "$public_key" >> /mnt/host/home/deploy/.ssh/authorized_keys
            chown -R "$deploy_uid:$deploy_gid" /mnt/host/home/deploy/.ssh
            chmod 700 /mnt/host/home/deploy/.ssh
            chmod 600 /mnt/host/home/deploy/.ssh/authorized_keys
            sync
            echo "RECOVERY: deployment key installed"
            reboot
