name: Deploy Hetzner production
# Every main release is built once and promoted to the managed VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: empleado24-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Authenticate container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://empleado24.com
            NEXT_PUBLIC_SUPABASE_URL=https://zfgocnczkhvywwhdihwp.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_FQhptWgDotjOCr7lnI4o1w_0X20N0uD
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Deploy, verify health and rollback on failure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.28.17.124
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -u
            cd /opt/empleado24
            echo "DEPLOY: use immutable release image"

            supabase_publishable_key="sb_publishable_FQhptWgDotjOCr7lnI4o1w_0X20N0uD"
            if grep -q '^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=' .env.production; then
              sed -i "s|^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=.*$|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$supabase_publishable_key|" .env.production
            else
              printf '\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$supabase_publishable_key" >> .env.production
            fi

            compose() {
              docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml "$@"
            }

            current_container="$(compose ps -q app)"
            if [ -z "$current_container" ]; then
              echo "DEPLOY: current application container not found"
              exit 1
            fi

            previous_image="$(docker inspect --format='{{.Config.Image}}' "$current_container")"

            # Preserve the running release for rollback, then discard only Docker
            # objects not referenced by a running container. Volumes are never pruned.
            echo "DISK: reclaiming unused Docker objects"
            docker container prune --force
            docker image prune --all --force
            docker builder prune --all --force
            df -h / /var/lib/docker || true

            release_image="ghcr.io/${{ github.repository }}:${{ github.sha }}"

            echo "DEPLOY: previous image $previous_image"
            echo "DEPLOY: new image $release_image"
            echo "DEPLOY: pull release image"
            APP_IMAGE="$release_image" compose pull app cron backup || exit 1

            echo "DEPLOY: restart application services"
            APP_IMAGE="$release_image" compose up -d --no-deps app
            startup_rc=$?

            healthy=false
            if [ "$startup_rc" -eq 0 ]; then
              echo "HEALTH: verify production"
              for attempt in $(seq 1 6); do
                health_payload="$(curl --silent --show-error https://empleado24.com/api/health || true)"
                echo "HEALTH RESPONSE: $health_payload"
                if printf '%s' "$health_payload" | grep -q '^{"status":"ok"'; then
                  healthy=true
                  break
                fi
                echo "HEALTH: attempt $attempt/6 failed"
                sleep 5
              done
            fi

            if [ "$healthy" = true ]; then
              APP_IMAGE="$release_image" compose up -d --no-deps cron backup
              echo "HEALTH: OK"
              echo "DEPLOY: SUCCESS"
              compose ps
              new_container="$(compose ps -q app)"
              echo "RUNTIME: docker ps"
              docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.CreatedAt}}\t{{.Status}}'
              echo "RUNTIME: app inspect"
              docker inspect --format='image={{.Config.Image}} created={{.Created}} state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image_id={{.Image}}' "$new_container"
              echo "RUNTIME: Next build ID"
              docker exec "$new_container" cat /app/apps/web/.next/BUILD_ID
              exit 0
            fi

            echo "DIAGNOSTICS: new application did not become healthy"
            compose ps
            compose logs --no-color --tail=200 app || true
            new_container="$(compose ps -q app)"
            if [ -n "$new_container" ]; then
              docker inspect --format='{{json .State.Health}}' "$new_container" || true
            fi

            echo "ROLLBACK: restoring $previous_image"
            APP_IMAGE="$previous_image" compose up -d --force-recreate --no-deps app
            rollback_start_rc=$?

            rollback_healthy=false
            if [ "$rollback_start_rc" -eq 0 ]; then
              for attempt in $(seq 1 6); do
                health_payload="$(curl --silent --show-error https://empleado24.com/api/health || true)"
                echo "HEALTH RESPONSE: $health_payload"
                if printf '%s' "$health_payload" | grep -q '^{"status":"ok"'; then
                  rollback_healthy=true
                  break
                fi
                echo "ROLLBACK HEALTH: attempt $attempt/6 failed"
                sleep 5
              done
            fi

            if [ "$rollback_healthy" = true ]; then
              APP_IMAGE="$previous_image" compose up -d --no-deps cron backup
              echo "ROLLBACK: previous release restored and healthy"
              compose ps
              exit 1
            fi

            echo "ROLLBACK: FAILED — manual intervention required"
            compose ps
            exit 2
