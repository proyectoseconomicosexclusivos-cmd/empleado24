name: Deploy Hetzner production
# Every main release is built once and promoted to the managed VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: empleado24-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.28.17.124
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/empleado24
            git pull --ff-only origin main
            APP_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }} docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull
            APP_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }} docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            for i in $(seq 1 12); do curl --fail --silent https://empleado24.com/api/health && exit 0 || sleep 5; done
            exit 1
