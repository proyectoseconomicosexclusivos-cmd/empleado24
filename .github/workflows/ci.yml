name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install exactly from lockfile
        run: pnpm install --frozen-lockfile
      - name: Reject high or critical production CVEs
        run: pnpm audit --prod --audit-level high
      - name: Formatting changed source files
        run: |
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" --diff-filter=ACMR |
            grep -E '\.(?:[cm]?[jt]sx?|json)
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
